name: release

# Publishes on a version tag, from CI rather than from a laptop.
#
# Two reasons that matters beyond convenience. The npm token lives in GitHub
# secrets instead of in a shell history or a ~/.npmrc, and `--provenance` gets
# npm to attest which commit and which workflow produced the tarball, which is
# the difference between "trust me" and a verifiable build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for provenance: the OIDC token is what npm verifies.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package

      # Refuse to publish a tag that disagrees with package.json, which is how
      # you end up with a v0.2.0 tag pointing at a 0.1.0 tarball forever.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
