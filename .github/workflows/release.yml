name: release

# Publishes on a version tag using npm Trusted Publishing (OIDC).
#
# No token anywhere: not in a secret, not in a ~/.npmrc, not in a shell history.
# GitHub Actions proves its identity to npm directly, npm checks it against the
# trusted publisher configured for this package, and the tarball arrives with a
# provenance attestation. Nothing to rotate and nothing to leak.
#
# Configure the publisher first at
#   npmjs.com > package > Settings > Trusted Publisher
# pointing at this repository and this workflow filename.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token is the whole mechanism. Without this the publish falls
      # back to looking for a token and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24, not 22. Trusted publishing needs npm >= 11.5.1 and Node 22
      # still ships npm 10.9.8, so a 22 runner fails with no useful message.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Belt and braces: pin the npm major explicitly so a change in what the
      # runner bundles cannot silently drop us below the minimum, and print both
      # versions so the next failure is diagnosable from the log alone.
      - run: npm install -g npm@^11
      - run: |
          node --version
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package

      # Refuse to publish a tag that disagrees with package.json, which is how
      # you end up with a v0.2.0 tag pointing at a 0.1.0 tarball forever.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm publish --provenance --access public
