services:
  # Unit suite. No network, no credentials, no Suno account needed.
  #   docker compose run --rm test
  test:
    build: .
    command: npx vitest run tests/unit
    environment:
      CI: 'true'

  typecheck:
    build: .
    command: npx tsc --noEmit

  # The scheduled health check. Free probes only unless you add --paid.
  #   docker compose run --rm canary
  #   docker compose run --rm canary npx tsx scripts/canary.ts --paid
  #
  # SUNO_COOKIE holds the session cookie, any tier - good for about a year, not
  # the week once assumed here. Keep it in .env, which is gitignored, never here.
  canary:
    build: .
    command: npx tsx scripts/canary.ts
    env_file:
      # Optional so a fresh clone can still build and run the offline targets.
      - path: .env
        required: false

  # Re-record response baselines after a verified client update, then run
  # `npm run gen:baselines` and commit src/drift/. Mounts the baselines so the
  # new files land on the host.
  record-baselines:
    build: .
    command: npx tsx scripts/record-baselines.ts
    env_file:
      # Optional so a fresh clone can still build and run the offline targets.
      - path: .env
        required: false
    volumes:
      - ./src/drift/baselines:/app/src/drift/baselines

  # Live end-to-end check. Read-only by default; --generate spends 10 credits.
  smoke:
    build: .
    command: npx tsx scripts/smoke.ts
    env_file:
      # Optional so a fresh clone can still build and run the offline targets.
      - path: .env
        required: false
    volumes:
      - ./tmp-songs:/app/tmp-songs
